    // 場にあった手は、その場の途中で10捨てされた札より上（新しい側）に積み直す
    const fell = this.pile.filter(e => e.live);
    this.pile = this.pile.filter(e => !e.live).concat(fell);
    for (const entry of fell) entry.live = false;
    this.field = { plays: [], lock: NO_LOCK };
    if (this.eleven) {
      this.eleven = false;
      SIM_LOG && this.say(`　場が流れた（${reason}）→ イレブンバック解除／${this.rev ? "逆転（3が最強）" : "通常（2が最強）"}`, "flow");
    } else {
      SIM_LOG && this.say(`　場が流れた（${reason}）`, "flow");
    }
    for (const q of this.players) q.passed = false;
    if (this.players[parent].finished) {
      const ring = this.ringFrom(parent);
      parent = ring.length ? ring[0] : parent;
      SIM_LOG && this.say(`　上がった人の次、${this.players[parent].name} が親`, "flow");
    }
    this.trickNo++;
    this.turn = parent;
  }
}

/* ============================================================
   UI
   ============================================================ */
const el = id => document.getElementById(id);
let game = null;
let comLevel = "strong";  // COMの強さ：weak／normal／strong
let logLimit = 0;        // 進行ログ：0 = 全部見える／4 = 今の場を含めて直近4場だけ
let pending = null;      // { options, resolve } 人間の着手待ち
let selected = new Set();

function cardEl(card, opts = {}) {
  const tag = opts.button ? "button" : "div";
  const n = document.createElement(tag);
  n.className = "card " + (isJoker(card) ? "jk" : (RED.has(card.suit) ? "red" : "blk"));
  if (opts.button) n.type = "button";
  if (opts.selected) n.className += " sel";
  if (opts.disabled) n.disabled = true;
  const r = document.createElement("span"); r.className = "r";
  const s = document.createElement("span"); s.className = "s";
  if (isJoker(card)) { r.textContent = "JOKER"; s.textContent = "★"; }
  else { r.textContent = rankLabel(card.rank); s.textContent = SUIT_MARK[card.suit]; }
  n.append(r, s);
  if (opts.stand) {
    const t = document.createElement("span"); t.className = "stand";
    t.textContent = opts.stand; n.append(t);
  }
  if (opts.onClick) n.addEventListener("click", opts.onClick);
  n.setAttribute("aria-label", cardName(card) + (opts.stand ? ` (${opts.stand}の代役)` : ""));
  return n;
}

function renderLadder() {
  const rev = game.rev;
  el("order-state").textContent = rev ? "逆転（3が最強）" : "通常（2が最強）";
  el("order-state").className = "ladder-state" + (rev ? " rev" : "");
  const flags = el("flags"); flags.innerHTML = "";
  if (game.revolution) {
    const f = document.createElement("span"); f.className = "flag revo"; f.textContent = "革命";
    flags.append(f);
  }
  if (game.eleven) {
    const f = document.createElement("span"); f.className = "flag eb"; f.textContent = "イレブンバック";
    flags.append(f);
  }
  if (game.revolution && game.eleven) {
    const f = document.createElement("span"); f.className = "flag"; f.textContent = "打ち消し";
    flags.append(f);
  }
  const track = el("track"); track.innerHTML = "";
  const order = [...Array(SEQ_LEN).keys()].map(s => rankAtStrength(s, rev));
  order.forEach((r, k) => {
    const n = document.createElement("span");
    n.className = "rung " + (k >= SEQ_LEN - 3 ? "strong" : (k < 3 ? "weak" : ""));
    n.textContent = rankLabel(r);
    track.append(n);
  });
  // ジョーカーは常に最強。狭い画面では JK と短く出す
  const j = document.createElement("span");
  j.className = "rung joker";
  j.innerHTML = '<span class="full">JOKER</span><span class="short">JK</span>';
  j.title = "ジョーカーは革命中でも常に最強";
  track.append(j);
}

function renderSeats() {
  const seats = el("seats"); seats.innerHTML = "";
  for (const p of game.players) {
    const n = document.createElement("div");
    n.className = "seat" + (game.turn === p.idx && !p.finished ? " turn" : "") + (p.finished ? " out" : "");
    const nm = document.createElement("div"); nm.className = "seat-name";
    nm.textContent = p.name;
    if (p.idx === 0) { const b = document.createElement("span"); b.className = "you"; b.textContent = "YOU"; nm.append(b); }
    const nums = document.createElement("div"); nums.className = "seat-nums";
    nums.innerHTML = `手札 <b>${p.hand.length}</b>　山札 <b>${p.stock.length}</b>`;
    const bar = document.createElement("div"); bar.className = "stockbar";
    const fill = document.createElement("i");
    const denom = Math.max(1, Math.ceil(54 / game.players.length));
    fill.style.width = Math.min(100, (p.stock.length / denom) * 100) + "%";
    bar.append(fill);
    n.append(nm, nums, bar);
    const tag = document.createElement("div"); tag.className = "seat-tag";
    if (game.foulOrder.includes(p.idx)) { tag.className += " foul"; tag.textContent = "反則上がり"; }
    else if (p.finished) { tag.className += " done"; tag.textContent = p.place ? `上がり ${p.place}位` : "上がり"; }
    else if (p.passed) { tag.className += " passed"; tag.textContent = "パス済"; }
    else tag.innerHTML = "&nbsp;";
    n.append(tag);
    seats.append(n);
  }
}

function renderField() {
  const wrap = el("field-cards"); wrap.innerHTML = "";
  const slot = el("lock-slot"); slot.innerHTML = "";
  const meta = el("field-meta");
  if (!game.field.plays.length) {
    const t = document.createElement("span"); t.className = "field-empty";
    t.textContent = game.turn === 0 ? "空 — あなたが親です。好きな手から出せます" : "空";
    wrap.append(t);
    meta.textContent = "";
    return;
  }
  const { owner, play } = game.field.plays[game.field.plays.length - 1];
  play.cards.forEach((c, k) => {
    const [r, s] = play.virt[k];
    const stand = isJoker(c) && r !== null
      ? `${s ? SUIT_MARK[s] : ""}${rankLabel(r)}` : null;
    wrap.append(cardEl(c, { stand }));
  });
  meta.textContent = `${game.players[owner].name} — ${describePlay(play)}`;
  if (game.field.lock.kind !== "none") {
    const b = document.createElement("span");
    b.className = "lock-badge" + (game.field.lock.kind === "dead" ? " dead" : "");
    b.textContent = lockText(game.field.lock);
    slot.append(b);
  }
}

function currentInterpretations() {
  if (!pending) return [];
  const sel = game.players[0].hand.filter(c => selected.has(c.uid));
  if (!sel.length) return [];
  const keys = new Set(pending.options.map(P.key));
  return enumeratePlays(sel).filter(p => keys.has(P.key(p)));
}

function renderHand() {
  const me = game.players[0];
  const wrap = el("hand-cards"); wrap.innerHTML = "";
  const playable = new Set();
  if (pending) for (const o of pending.options) for (const c of o.cards) playable.add(c.uid);

  for (const c of me.hand) {
    wrap.append(cardEl(c, {
      button: true,
      selected: selected.has(c.uid),
      disabled: !pending || !playable.has(c.uid),
      onClick: () => {
        if (selected.has(c.uid)) selected.delete(c.uid); else selected.add(c.uid);
        render();
      },
    }));
  }

  el("hand-hint").textContent = pending
    ? `カードを選んでください（山札 ${me.stock.length}枚）`
    : (me.finished ? "上がり済み" : "…相手の手番");

  const actions = el("actions"); actions.innerHTML = "";
  if (!pending) return;

  const interps = currentInterpretations();
  const box = document.createElement("div"); box.className = "interp";
  if (selected.size === 0) {
    const t = document.createElement("div"); t.className = "interp-note";
    t.textContent = "出したいカードをタップすると、その組み合わせで成立する出し方が並びます。";
    box.append(t);
  } else if (!interps.length) {
    const t = document.createElement("div"); t.className = "bad";
    t.textContent = "この組み合わせでは出せません（形・強さ・縛りのいずれかが合いません）";
    box.append(t);
  } else {
    if (interps.length > 1) {
      const t = document.createElement("div"); t.className = "interp-note";
      t.textContent = "解釈を選べます。発動する効果と得点が変わります。";
      box.append(t);
    }
    for (const p of interps) {
      const b = document.createElement("button");
      b.className = "play-opt"; b.type = "button";
      const label = document.createElement("span");
      label.innerHTML = `<b>${describePlay(p)}</b>`;
      b.append(label);
      const eff = effectSummary(p);
      if (eff.length) {
        const e = document.createElement("span"); e.className = "eff";
        e.textContent = eff.join(" / "); b.append(e);
      }
      if (isFoulFinish(p, me.hand.length, !me.stock.length)) {
        const w = document.createElement("span"); w.className = "foul";
        w.textContent = "反則上がり → 最下位が確定します";
        b.append(w);
      }
      const t = twelveOutcome(game, 0, p);
      if (t) {
        const w = document.createElement("span");
        w.className = t.kind === "foul" ? "foul" : "eff";
        w.textContent =
          t.kind === "foul" ? (t.cands.length
            ? `拾えるのが ${t.cands.map(cardName).join("・")} だけ → 最下位が確定します`
            : "反則上がり → 最下位が確定します")
          : t.kind === "finish" ? "拾えるカードがないので、このまま上がり"
          : t.kind === "choose" ? "拾うカードを選べます（2・8・♠3・12・JOKERを拾うと最下位）"
          : `${t.cands.map(cardName).join("・")} を拾い、次に出せば上がり`;
        b.append(w);
      }
      b.addEventListener("click", () => submitPlay(p));
      box.append(b);
    }
  }
  actions.append(box);

  const row = document.createElement("div"); row.className = "actions-row";
  const clear = document.createElement("button");
  clear.className = "btn btn-sm btn-ghost"; clear.type = "button";
  clear.textContent = "選択解除";
  clear.disabled = selected.size === 0;
  clear.addEventListener("click", () => { selected.clear(); render(); });
  row.append(clear);

  const pass = document.createElement("button");
  pass.className = "btn btn-sm"; pass.type = "button";
  pass.textContent = "パス";
  pass.disabled = game.field.plays.length === 0;
  pass.title = game.field.plays.length === 0 ? "場が空のときはパスできません（親）" : "";
  pass.addEventListener("click", () => submitPlay(null));
  row.append(pass);
  actions.append(row);

  const list = el("helper-list"); list.innerHTML = "";
  const seen = new Set();
  for (const o of pending.options) {
    const d = describePlay(o);
    if (seen.has(d)) continue;
    seen.add(d);
    const li = document.createElement("li");
    const eff = effectSummary(o);
    li.textContent = d + (eff.length ? `　→ ${eff.join(" / ")}` : "");
    list.append(li);
  }
  if (!pending.options.length) {
    const li = document.createElement("li");
    li.textContent = "出せる手はありません。パスしてください。";
    list.append(li);
  }
}

function renderLog() {
  const box = el("log");
  box.innerHTML = "";
  const title = el("log-title");
  if (title) title.textContent = logLimit ? `進行ログ（直近${logLimit}場だけ）` : "進行ログ";
  // 直近モード：今の場を含めて logLimit 場ぶんだけ見せる。それより前は消える
  const from = logLimit ? game.trickNo - logLimit + 1 : -Infinity;
  const shown = logLimit ? game.log.filter(e => (e.trick ?? 0) >= from) : game.log;
  if (logLimit && shown.length < game.log.length) {
    const d = document.createElement("div");
    d.className = "flow"; d.textContent = "……これより前の場はもう見えません";
    box.append(d);
  }
  for (const entry of shown.slice(-160)) {
    const d = document.createElement("div");
    d.className = entry.cls; d.textContent = entry.text;
    box.append(d);
  }
  box.scrollTop = box.scrollHeight;
}

function render() {
  if (!game) return;
  renderLadder(); renderSeats(); renderField(); renderHand(); renderLog();
  el("sub").textContent =
    `第${game.roundNo}ラウンド　`+ game.players.map(p => `${p.name} ${p.score.toLocaleString()}点`).join("　");
}

function submitPlay(play) {
  if (!pending) return;
  const resolve = pending.resolve;
  pending = null; selected.clear();
  render();
  resolve(play);
}

/* --- モーダル --- */
function showModal(build) {
  return new Promise(resolve => {
    const root = el("modal-root");
    const scrim = document.createElement("div"); scrim.className = "scrim";
    const modal = document.createElement("div"); modal.className = "modal";
    modal.setAttribute("role", "dialog"); modal.setAttribute("aria-modal", "true");
    scrim.append(modal); root.append(scrim);
    build(modal, value => { root.innerHTML = ""; resolve(value); });
    const focusable = modal.querySelector("button");
    if (focusable) focusable.focus();
  });
}

function pickCardsModal(title, note, cards, n) {
  return showModal((modal, done) => {
    const chosen = new Set();
    const h = document.createElement("h2"); h.textContent = title;
    const p = document.createElement("p"); p.textContent = note;
    const row = document.createElement("div"); row.className = "hand-cards";
    const ok = document.createElement("button");
    ok.className = "btn btn-primary"; ok.type = "button";
    const sync = () => {
      ok.textContent = `決定（${chosen.size}/${n}）`;
      ok.disabled = chosen.size !== n;
      row.querySelectorAll("button.card").forEach((b, k) => {
        b.classList.toggle("sel", chosen.has(cards[k].uid));
      });
    };
    cards.forEach(c => {
      row.append(cardEl(c, {
        button: true,
        onClick: () => {
          if (chosen.has(c.uid)) chosen.delete(c.uid);
          else if (chosen.size < n) chosen.add(c.uid);
          sync();
        },
      }));
    });
    ok.addEventListener("click", () => done(cards.filter(c => chosen.has(c.uid))));
    modal.append(h, p, row, ok);
    sync();
  });
}

class HumanAgent {
  choosePlay(g, me, options) {
    return new Promise(resolve => {
      pending = { options, resolve };
      selected.clear();
      render();
    });
  }
  async chooseDiscard(g, me, n) {
    return pickCardsModal(
      "10捨て", `手札から捨てるカードを${n}枚選んでください。捨てるほど山札を掘れて上がりに近づきます。`,
      g.players[me].hand.slice(), n);
  }
  async choosePickup(g, me, options) {
    const pl = g.players[me];
    const last = !pl.stock.length && !pl.hand.length;
    return showModal((modal, done) => {
      const h = document.createElement("h2"); h.textContent = "12の拾い";
      const p = document.createElement("p");
      p.textContent = "引き取るカードを選んでください（必ず拾います）。階段からは列の両端しか取れません。" +
        (last ? "拾ったカードが最後の1枚になります。2・8・♠3・12・JOKERだと最下位が確定します。" : "");
      const stack = document.createElement("div"); stack.className = "stack";
      options.forEach(o => {
        const b = document.createElement("button");
        b.className = "play-opt"; b.type = "button";
        b.textContent = o.map(cardName).join("  ");
        if (last && o.length === 1 && lastCardBad(o[0])) {
          const w = document.createElement("span"); w.className = "foul";
          w.textContent = "最後の1枚になり最下位が確定"; b.append(w);
        }
        b.addEventListener("click", () => done(o));
        stack.append(b);
      });
      modal.append(h, p, stack);
    });
  }
  async chooseGive(g, me, n, strongest) {
    const hand = g.players[me].hand.slice();
    if (strongest) {
      const give = hand.slice().sort((a, b) =>
        (isJoker(b) ? 999 : strength(b.rank,false)) - (isJoker(a) ? 999 : strength(a.rank,false))
      ).slice(0, n);
      return showModal((modal, done) => {
        const h = document.createElement("h2"); h.textContent = "カード交換";
        const p = document.createElement("p");
        p.textContent = `下位なので、一番強いカード${n}枚を渡します（強制）。`;
        const row = document.createElement("div"); row.className = "hand-cards";
        give.forEach(c => row.append(cardEl(c)));
        const ok = document.createElement("button");
        ok.className = "btn btn-primary"; ok.type = "button"; ok.textContent = "わかった";
        ok.addEventListener("click", () => done(give));
        modal.append(h, p, row, ok);
      });
    }
    return pickCardsModal("カード交換",
      `下位の人に渡すカードを${n}枚選んでください（いらないカード）。`, hand, n);
  }
}

/* --- ラウンド結果 --- */
function showResult(result) {
  return showModal((modal, done) => {
    const h = document.createElement("h2");
    h.textContent = `第${game.roundNo}ラウンド 結果`;
    const p = document.createElement("p");
    p.textContent = result.winPlay
      ? `上がり手：${describePlay(result.winPlay)}　${result.detail}`
      : `正規の上がりは出ませんでした。${result.detail}`;
    const stack = document.createElement("div"); stack.className = "stack";
    game.players.slice().sort((a, b) => a.place - b.place).forEach(pl => {
      const row = document.createElement("div"); row.className = "scoreline";
      const a = document.createElement("span"); a.className = "pl"; a.textContent = `${pl.place}位`;
      const b = document.createElement("span"); b.className = "nm"; b.textContent = pl.name;
      const c = document.createElement("span"); c.textContent = `${pl.score.toLocaleString()}点`;
      row.append(a, b, c); stack.append(row);
    });
    const next = document.createElement("button");
    next.className = "btn btn-primary"; next.type = "button"; next.textContent = "次のラウンドへ";
    next.addEventListener("click", () => done(true));
    const stop = document.createElement("button");
    stop.className = "btn btn-ghost"; stop.type = "button"; stop.textContent = "ここでやめる";
    stop.addEventListener("click", () => done(false));
    const row = document.createElement("div"); row.className = "actions-row";
    row.append(next, stop);
    modal.append(h, p, stack, row);
  });
}

// COMの強さ（3段階）
const COM_LEVELS = {
  weak:   { label: "よわい", note: "よわい：今の1手だけを見て決めます（旧COM）。" },
  normal: { label: "ふつう", note: "ふつう：見えない札をランダムに配り直し、ラウンドの最後まで先読みします（1手に約1秒）。" },
  strong: { label: "つよい", note: "つよい：ふつうの先読みに加えて、相手のパスや出し方から手札を読みます（1手に約1.6秒）。" },
};
const makeComFor = level =>
  level === "weak" ? new ComAgent()
  // つよい：読みのぶん考える時間を長くして、試す配り方の数をふつうと同じくらいにする
  : level === "strong" ? new MasterAgent({ read: true, budgetMs: 1600 })
  : new MasterAgent();

function showSetup() {
  return showModal((modal, done) => {
    let n = 3;
    const h = document.createElement("h2"); h.textContent = "大富豪 縛りと革命";
    const p = document.createElement("p");
    p.textContent = "手札は常に5枚に補充されます。勝利条件は手札と山札の両方を使い切ること。つまり山札を先に掘り切った人が勝ちです。";
    const row = document.createElement("div"); row.className = "setup-row";
    const chips = [];
    [2,3,4].forEach(k => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = `${k}人`;
      b.setAttribute("aria-pressed", String(k === n));
      b.addEventListener("click", () => {
        n = k; chips.forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      });
      chips.push(b); row.append(b);
    });
    const note = document.createElement("p");
    note.style.cssText = "font-size:12px;opacity:.75;margin:0";
    note.textContent = "COMの強さは下で選べます。";
    const label = t => {
      const x = document.createElement("p");
      x.style.cssText = "font-size:12px;font-weight:700;margin:4px 0 0";
      x.textContent = t; return x;
    };
    let lim = logLimit;
    const logRow = document.createElement("div"); logRow.className = "setup-row";
    const logChips = [];
    [[0, "全部見える"], [4, "直近4場だけ"]].forEach(([k, t]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = t;
      b.setAttribute("aria-pressed", String(k === lim));
      b.addEventListener("click", () => {
        lim = k; logChips.forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      });
      logChips.push(b); logRow.append(b);
    });
    const logNote = document.createElement("p");
    logNote.style.cssText = "font-size:12px;opacity:.75;margin:0";
    logNote.textContent = "「直近4場だけ」は、今の場を含めて4場より前のログが消えます。相手が出した札を覚えておく練習用です。";
    let lv = comLevel;
    const lvRow = document.createElement("div"); lvRow.className = "setup-row";
    const lvChips = [];
    const lvNote = document.createElement("p");
    lvNote.style.cssText = "font-size:12px;opacity:.75;margin:0";
    const showLv = () => { lvNote.textContent = COM_LEVELS[lv].note; };
    Object.entries(COM_LEVELS).forEach(([k, v]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = v.label;
      b.setAttribute("aria-pressed", String(k === lv));
      b.addEventListener("click", () => {
        lv = k; lvChips.forEach(c => c.setAttribute("aria-pressed", String(c === b))); showLv();
      });
      lvChips.push(b); lvRow.append(b);
    });
    showLv();
    const ok = document.createElement("button");
    ok.className = "btn btn-primary"; ok.type = "button"; ok.textContent = "はじめる";
    ok.addEventListener("click", () => done({ n, logLimit: lim, level: lv }));
    modal.append(h, p, label("人数"), row, label("COMの強さ"), lvRow, lvNote,
                 label("進行ログ"), logRow, logNote, ok);
  });
}

function showRules() {
  showModal((modal, done) => {
    const h = document.createElement("h2"); h.textContent = "覚えておくこと";
    const ul = document.createElement("ul");
    ul.style.cssText = "margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:6px";
    [
      "勝利条件は<b>手札と山札を両方使い切る</b>こと。手札は5枚に補充されるので、山札の枚数が勝敗の指標です。",
      "<b>10捨て</b>は出した枚数ぶん手札を捨てられる＝山札を余分に掘れるので、最大の前進手段です。",
      "<b>12拾い</b>は必ず拾うので山札が減らず、後退します。妨害用。",
      "<b>12で拾う札</b>は捨札の一番上から。場の札は<b>流れた瞬間</b>に捨札へ落ちるので、その場で10捨てした札より上に積まれます。",
      "同じマークが2手続くと<b>マーク縛り</b>。1つ上の数字を出すと<b>階段縛り</b>（次はその次の1枚だけ）。",
      "同じマークで<b>1つ下</b>を出す<b>切り返し</b>も可能。次の人は、さらに1つ下の同じ構成しか出せません。",
      "4枚以上を一度に出すと<b>革命</b>で強さが逆転。<b>イレブンバック</b>と重なると打ち消し合って通常に戻ります。",
      "ジョーカーは単体最強。ただし<b>単体の場ではスペードの3だけがジョーカーに勝てます</b>。勝つと<b>場が流れ、スペードの3を出した人が親</b>になります。",
      "<b>8・2・スペードの3・ジョーカー単体で上がると「反則上がり」</b>で、その場で<b>最下位が確定</b>します。出すことはできるので、最後に残さないよう配りましょう。危ない手には赤い警告が出ます。",
      "<b>最後の1枚が12</b>なら、出して1枚拾い、次の手番にその札で上がれます。拾った札が<b>2・8・スペードの3・12・ジョーカー</b>だと上がれないので、その場で<b>最下位が確定</b>。拾える札がなければそのまま上がりです。",
      "得点は<b>1位だけ</b>。<b>最下位の残り枚数×50点</b>（1位が上がった時点の枚数。7で上がると1枚ごとに2倍）。<b>ジョーカーペアで上がると×1,000点</b>。",
    ].forEach(t => { const li = document.createElement("li"); li.innerHTML = t; ul.append(li); });
    const ok = document.createElement("button");
    ok.className = "btn btn-primary"; ok.type = "button"; ok.textContent = "閉じる";
    ok.addEventListener("click", () => done(true));
    modal.append(h, ul, ok);
  });
}

/* --- 起動 --- */
let running = false;
async function startApp() {
  if (running) return;
  running = true;
  const setup = await showSetup();
  const n = setup.n;
  logLimit = setup.logLimit;
  comLevel = setup.level || "strong";
  const names = ["あなた"].concat([...Array(n - 1).keys()].map(i => `COM${i + 1}`));
  // COMの強さは開始画面で選ぶ（全員同じ強さ）
  const makeCom = () => makeComFor(comLevel);
  const agents = [new HumanAgent()].concat([...Array(n - 1)].map(makeCom));
  game = new Game(names, agents);
  game.onChange = render;
  render();
  while (true) {
    const result = await game.playRound();
    render();
    const again = await showResult(result);
    if (!again) break;
  }
  running = false;
  el("hand-hint").textContent = "終了しました。「やり直す」で新しい対局を始められます。";
}

el("restart-btn").addEventListener("click", () => {
  pending = null; selected.clear(); running = false;
  el("modal-root").innerHTML = "";
  startApp();
});
el("rules-btn").addEventListener("click", showRules);

const boot = () => startApp();
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
